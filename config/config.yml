# Portable context preset. Select your own provider/model with /login and /model.
tools:
  approvalMode: yolo
  approval:
    task: deny
computer:
  enabled: false
collab:
  autoStart: "off"
compaction:
  enabled: true
  # Keep native notes and full-history retrieval. The extension excludes
  # new_context so OMP uses its regular summary pipeline for compaction.
  experimentalContextManagement: true
  methodOrder: [shake, soft]
  asyncEnabled: false
  midTurnEnabled: true
  thresholdTokens: 120000
  thresholdPercent: -1
  keepRecentTokens: 20000
  autoContinue: true
  idleEnabled: false
  supersedeReads: false
  dropUseless: false
providers:
  cacheWarming: "off"
memory:
  backend: "off"
advisor:
  enabled: false
